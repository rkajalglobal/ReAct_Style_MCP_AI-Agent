[project]
name = "mcp-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ruchi Kajal", email = "rkajalglobal@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.201.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.6",
    "langchain-google-community>=5.1.1",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "mcp>=1.30.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
mcp-project = "mcp_project:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
